<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>UML class diagram</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    html, body { height: 100%; margin: 0; }
    body { background: #ffffff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #333; }
    .page {
      height: 100%;
      padding: 16px;
      box-sizing: border-box;
      display: grid;
      grid-template-columns: minmax(0, 2.5fr) minmax(280px, 1fr);
      gap: 16px;
    }
    .diagram-pane, .source-pane {
      border: 1px solid #e5e5e5;
      border-radius: 10px;
      background: #fafafa;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    .page.source-collapsed {
      grid-template-columns: minmax(0, 1fr);
    }
    .page.source-collapsed .source-pane {
      display: none;
    }
    .diagram-wrap {
      position: relative;
      flex: 1 1 auto;
      overflow: hidden;
    }
    .diagram-canvas { position: absolute; inset: 0; }
    .diagram-status { padding: 12px 16px; background: #fff3cd; border-bottom: 1px solid #e5d28d; }
    .diagram-status[hidden] { display: none; }
    .diagram-status div { margin-top: 4px; font-size: 12px; }
    button:disabled { opacity: 0.5; cursor: default; }
    .diagram-toolbar {
      position: absolute;
      top: 8px;
      right: 8px;
      z-index: 2;
      display: flex;
      gap: 6px;
    }
    .diagram-toolbar button {
      padding: 6px 10px;
      border: 1px solid #d0d0d0;
      background: #fff;
      border-radius: 8px;
      cursor: pointer;
    }
    .diagram-wrap .svg-pan-zoom_viewport { cursor: grab; }
    .diagram-wrap .svg-pan-zoom_viewport:active { cursor: grabbing; }
    .diagram-wrap svg { width: 100% !important; height: 100% !important; max-width: none !important; }
    .source-header {
      padding: 12px 16px;
      border-bottom: 1px solid #e5e5e5;
      background: rgba(255, 255, 255, 0.8);
      font-weight: 600;
      letter-spacing: 0.02em;
      text-transform: uppercase;
      font-size: 12px;
      color: #5a5a5a;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .source-header button {
      padding: 6px 10px;
      border: 1px solid #d0d0d0;
      background: #fff;
      border-radius: 8px;
      cursor: pointer;
      font-size: 11px;
      text-transform: none;
    }
    .copy-status {
      font-size: 11px;
      color: #2f7a2f;
      opacity: 0;
      transition: opacity 0.2s ease;
      min-width: 70px;
      text-align: right;
    }
    .copy-status.visible {
      opacity: 1;
    }
    .copy-status.error {
      color: #b00020;
    }
    .source-content {
      flex: 1 1 auto;
      overflow: auto;
      padding: 16px;
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
      font-size: 12px;
      line-height: 1.5;
      background: #ffffff;
      color: #333;
      white-space: pre;
    }
    pre.mermaid { display: none; }
  </style>
</head>
<body>

<div class="page source-collapsed">
  <pre class="mermaid" id="m1">
${mermaidString}
  </pre>
</div>

  <script src="https://cdn.jsdelivr.net/npm/mermaid@11.10.1/dist/mermaid.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/svg-pan-zoom@3.6.1/dist/svg-pan-zoom.min.js"></script>

  <script>
    const vscode = acquireVsCodeApi();
    const viewId = document.body.dataset.mermaidView || '';
    const initialSource = document.getElementById('m1').textContent.trim();
    const page = document.querySelector('.page');
    page.innerHTML = '';

    const diagramPane = document.createElement('div');
    diagramPane.className = 'diagram-pane';
    const statusBox = document.createElement('div');
    statusBox.className = 'diagram-status';
    statusBox.setAttribute('role', 'status');
    statusBox.hidden = true;
    diagramPane.appendChild(statusBox);
    const wrap = document.createElement('div');
    wrap.className = 'diagram-wrap';
    diagramPane.appendChild(wrap);
    const toolbar = document.createElement('div');
    toolbar.className = 'diagram-toolbar';
    toolbar.innerHTML =
      '<button type="button" data-a="zin">+</button>' +
      '<button type="button" data-a="zout">−</button>' +
      '<button type="button" data-a="fit">Fit</button>' +
      '<button type="button" data-a="download">Download SVG</button>' +
      '<button type="button" data-a="toggle-source" aria-expanded="false">Show code</button>';
    wrap.appendChild(toolbar);
    let canvas = document.createElement('div');
    canvas.className = 'diagram-canvas';
    wrap.appendChild(canvas);
    const sourcePane = document.createElement('div');
    sourcePane.className = 'source-pane';
    sourcePane.innerHTML = '<div class="source-header"><span>Mermaid source</span><span class="copy-status" aria-live="polite" role="status"></span><button type="button" class="copy-button">Copy</button></div>';
    const sourceContent = document.createElement('pre');
    sourceContent.className = 'source-content';
    sourcePane.appendChild(sourceContent);
    page.append(diagramPane, sourcePane);
    const copyButton = sourcePane.querySelector('.copy-button');

    let svgEl = null;
    let pz = null;
    let exportViewBox = null;
    let renderedSource = null;
    let renderedCompact = null;
    let generation = 0;
    let renderSequence = 0;
    let rendering = Promise.resolve();
    let deferredUpdate = null;

    function viewportAvailable() {
      return !document.hidden && wrap.clientWidth > 0 && wrap.clientHeight > 0;
    }

    function showStatus(title, detail) {
      statusBox.replaceChildren();
      statusBox.hidden = !title;
      if (!title) { if (pz && viewportAvailable()) pz.resize(); return; }
      const heading = document.createElement('strong');
      heading.textContent = title;
      const description = document.createElement('div');
      description.textContent = detail;
      statusBox.append(heading, description);
      if (pz && viewportAvailable()) pz.resize();
    }

    function showCompileStatus(status) {
      if (status === 'last-valid') {
        showStatus('Last valid diagram snapshot shown', 'The latest saved model did not compile. Fix the errors and save again to refresh the diagram.');
      } else if (status === 'empty') {
        showStatus('Source file is empty', 'Add INTERLIS content and save to render the diagram.');
      } else if (status === 'unavailable') {
        showStatus('Diagram unavailable', 'No valid saved model snapshot is available. Save a valid model to refresh the diagram.');
      } else showStatus('', '');
    }

    function setControlsEnabled(enabled) {
      toolbar.querySelectorAll('button:not([data-a="toggle-source"])').forEach(button => button.disabled = !enabled);
      copyButton.disabled = !enabled;
    }

    function clearDiagram() {
      deferredUpdate = null;
      if (pz) pz.destroy();
      pz = null;
      svgEl = null;
      exportViewBox = null;
      renderedSource = null;
      renderedCompact = null;
      canvas.replaceChildren();
      sourceContent.textContent = '';
      setControlsEnabled(false);
    }

    async function updateDiagram(diagram, revision) {
      if (revision !== generation) return;
      if (diagram.status === 'empty' || diagram.status === 'unavailable') {
        clearDiagram();
        showCompileStatus(diagram.status);
        return;
      }
      if (diagram.source === renderedSource && diagram.hideEmptyMembersBox === renderedCompact) {
        showCompileStatus(diagram.status);
        return;
      }
      if (!viewportAvailable()) {
        deferredUpdate = { diagram, revision };
        return;
      }
      deferredUpdate = null;
      let stage = null;
      let nextPz = null;
      try {
        mermaid.initialize({
          startOnLoad: false,
          securityLevel: 'loose',
          maxTextSize: 1000000,
          flowchart: { useMaxWidth: false },
          er: { useMaxWidth: false },
          sequence: { useMaxWidth: false },
          class: { useMaxWidth: false, hideEmptyMembersBox: diagram.hideEmptyMembersBox },
          classDiagram: { useMaxWidth: false },
          themeCSS: '.mermaid svg{max-width:none !important;height:100% !important;width:100% !important;}'
        });
        stage = document.createElement('div');
        stage.className = 'diagram-canvas';
        stage.style.visibility = 'hidden';
        wrap.appendChild(stage);
        // Keep Mermaid's temporary/error SVGs inside a disposable container as well.
        const out = await mermaid.render('mermaid-svg-' + (++renderSequence), diagram.source, stage);
        if (revision !== generation) return;
        stage.innerHTML = out.svg;
        const nextSvg = stage.querySelector('svg');
        if (!nextSvg) throw new Error('Mermaid did not return an SVG diagram.');
        const nextViewBox = nextSvg.getAttribute('viewBox');
        nextSvg.style.maxWidth = 'none';
        nextSvg.style.width = '100%';
        nextSvg.style.height = '100%';
        nextSvg.setAttribute('width', '100%');
        nextSvg.setAttribute('height', '100%');
        wrap.appendChild(stage);
        // Keep effective scale and translation, even if the new graph has different dimensions.
        const viewport = pz ? { scale: pz.getSizes().realZoom, pan: pz.getPan() } : null;
        nextPz = svgPanZoom(nextSvg, {
          zoomEnabled: true, panEnabled: true, mouseWheelZoomEnabled: true,
          controlIconsEnabled: false, fit: true, center: true,
          minZoom: 0.2, maxZoom: 10, contain: false, preventMouseEventsDefault: true
        });
        if (viewport) {
          const baseScale = nextPz.getSizes().realZoom / nextPz.getZoom();
          const zoom = viewport.scale / baseScale;
          nextPz.setMinZoom(Math.min(0.2, zoom));
          nextPz.setMaxZoom(Math.max(10, zoom));
          nextPz.zoom(zoom);
          nextPz.pan(viewport.pan);
        }
        if (out.bindFunctions) out.bindFunctions(nextSvg);
        if (pz) pz.destroy();
        canvas.remove();
        canvas = stage;
        canvas.style.visibility = '';
        stage = null;
        pz = nextPz;
        nextPz = null;
        svgEl = nextSvg;
        exportViewBox = nextViewBox;
        renderedSource = diagram.source;
        renderedCompact = diagram.hideEmptyMembersBox;
        sourceContent.textContent = diagram.source.trim();
        setControlsEnabled(true);
        showCompileStatus(diagram.status);
      } catch (error) {
        if (revision !== generation) return;
        showStatus('Diagram update failed', svgEl ? 'The previous diagram is still shown. See INTERLIS LSP Debug for details.' : 'See INTERLIS LSP Debug for details.');
        vscode.postMessage({ type: 'mermaid:renderError', viewId, detail: String(error && (error.stack || error.message) || error) });
      } finally {
        if (nextPz) nextPz.destroy();
        if (stage) stage.remove();
      }
    }

    function scheduleUpdate(diagram, revision) {
      // Mermaid configuration is global. Serialize rendering and discard obsolete revisions.
      rendering = rendering.then(() => updateDiagram(diagram, revision));
      return rendering;
    }

    window.addEventListener('message', event => {
      const message = event.data;
      if (!message || message.viewId !== viewId || !Number.isInteger(message.generation)
          || message.generation < generation) return;
      generation = message.generation;
      if (message.type === 'mermaid:update' && message.diagram) scheduleUpdate(message.diagram, generation);
      else if (message.type === 'mermaid:error') showStatus('Diagram update failed', 'The previous diagram is still shown. See INTERLIS LSP Debug for details.');
    });

    toolbar.addEventListener('click', event => {
      const action = event.target && event.target.getAttribute('data-a');
      if (!action) return;
      event.preventDefault();
      if (action === 'zin' && pz) pz.zoomBy(1.2);
      if (action === 'zout' && pz) pz.zoomBy(1 / 1.2);
      if (action === 'fit' && pz) { pz.resize(); pz.fit(); pz.center(); }
      if (action === 'download' && svgEl) downloadSVG(svgEl, 'diagram.svg', exportViewBox);
      if (action === 'toggle-source') {
        const collapsed = !page.classList.contains('source-collapsed');
        page.classList.toggle('source-collapsed', collapsed);
        const button = toolbar.querySelector('[data-a="toggle-source"]');
        button.textContent = collapsed ? 'Show code' : 'Hide code';
        button.setAttribute('aria-expanded', String(!collapsed));
        if (pz) pz.resize();
      }
    });
    copyButton.addEventListener('click', () => {
      copyTextToClipboard(sourceContent.textContent || '').then(success => showCopyFeedback(copyButton, success));
    });
    function resumeVisibleDiagram() {
      if (!viewportAvailable()) return;
      if (pz) pz.resize();
      if (deferredUpdate) {
        const update = deferredUpdate;
        deferredUpdate = null;
        scheduleUpdate(update.diagram, update.revision);
      }
    }
    document.addEventListener('visibilitychange', resumeVisibleDiagram);
    window.addEventListener('resize', resumeVisibleDiagram, { passive: true });
    setControlsEnabled(false);
    scheduleUpdate({ source: initialSource, hideEmptyMembersBox: ${hideEmptyMembersBox}, status: 'current' }, 0)
      .then(() => vscode.postMessage({ type: 'mermaid:ready', viewId }));


function downloadSVG(svgEl, filename, viewBox) {
  // Clone so we can tweak without touching the on-page SVG
  var clone = svgEl.cloneNode(true);

  // Undo svg-pan-zoom’s viewport transform so you get the full diagram
  var vp = clone.querySelector('.svg-pan-zoom_viewport');
  if (vp) vp.removeAttribute('transform');

  // Ensure clean sizing (portable in other tools)
  var vb = viewBox || clone.getAttribute('viewBox');
  if (vb) clone.setAttribute('viewBox', vb);
  if (vb) {
    var p = vb.trim().split(/\s+/);
    var w = parseFloat(p[2]), h = parseFloat(p[3]);
    if (!isNaN(w) && !isNaN(h)) {
      clone.setAttribute('width', w + 'px');
      clone.setAttribute('height', h + 'px');
    }
  }
  clone.style.maxWidth = 'none';
  clone.removeAttribute('style'); // drop width:100%/height:100% if present

  // Ensure namespaces for standalone file
  if (!clone.getAttribute('xmlns')) clone.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
  if (!clone.getAttribute('xmlns:xlink')) clone.setAttribute('xmlns:xlink', 'http://www.w3.org/1999/xlink');

  // Serialize and hand off to the extension for saving
  var xml = '<?xml version="1.0" encoding="UTF-8"?>\n' + new XMLSerializer().serializeToString(clone);
  vscode.postMessage({ type: 'downloadSvg', filename: filename || 'diagram.svg', svg: xml });
}

function copyTextToClipboard(text) {
  if (!text) { return Promise.resolve(false); }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    return navigator.clipboard.writeText(text).then(function () {
      return true;
    }).catch(function () {
      return legacyCopy(text);
    });
  }
  return Promise.resolve(legacyCopy(text));
}

function legacyCopy(text) {
  var textarea = document.createElement('textarea');
  textarea.value = text;
  textarea.setAttribute('readonly', '');
  textarea.style.position = 'absolute';
  textarea.style.left = '-9999px';
  document.body.appendChild(textarea);
  textarea.select();
  var success = false;
  try {
    success = document.execCommand('copy');
  } catch (err) {
    console.error('Failed to copy text', err);
    success = false;
  }
  document.body.removeChild(textarea);
  return success;
}

function showCopyFeedback(button, success) {
  if (!button) { return; }
  var header = button.closest('.source-header');
  if (!header) { return; }
  var status = header.querySelector('.copy-status');
  if (!status) { return; }

  status.textContent = success ? 'Copied!' : 'Copy failed';
  status.classList.toggle('error', !success);
  status.classList.add('visible');

  if (status._copyTimeout) {
    clearTimeout(status._copyTimeout);
  }
  status._copyTimeout = setTimeout(function () {
    status.classList.remove('visible');
  }, 2000);
}


  </script>
</body>
</html>
